# =============================================================================
# T.N. Memorial Public School Digital Platform
# GitHub Actions — Continuous Integration
# =============================================================================
#
# Gates:
#   1. Repository safety (no secrets/artifacts committed)
#   2. Backend validation (PHP syntax, composer)
#   3. Website production build
#   4. ERP production build
#   5. Docker Compose configuration validation
#
# Triggers: push to main/dev/feat/**, pull requests
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'sprint/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # Job 1: Repository Safety
  # ===========================================================================
  repo-safety:
    name: Repository Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify no .env files committed
        run: |
          set -euo pipefail
          echo "::group::Checking for .env files"
          FOUND=$(find . -name '.env' -not -path './.git/*' -not -path './node_modules/*' -not -path './vendor/*' | head -20 || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Found .env files in repository:"
            echo "$FOUND"
            exit 1
          fi
          echo "No .env files found in repository"
          echo "::endgroup::"

      - name: Verify no .next build artifacts committed
        run: |
          set -euo pipefail
          echo "::group::Checking for .next directories"
          if [ -d "apps/website/.next" ] || [ -d "apps/erp/.next" ]; then
            echo "::error::Found .next build artifacts in repository. These must be in .gitignore."
            exit 1
          fi
          echo "No .next artifacts found"
          echo "::endgroup::"

      - name: Verify no node_modules committed
        run: |
          set -euo pipefail
          echo "::group::Checking for node_modules"
          FOUND=$(find . -name 'node_modules' -type d -not -path './.git/*' | head -5 || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Found node_modules in repository:"
            echo "$FOUND"
            exit 1
          fi
          echo "No node_modules found"
          echo "::endgroup::"

      - name: Verify no vendor directory committed
        run: |
          set -euo pipefail
          echo "::group::Checking for vendor directories"
          if [ -d "backend/vendor" ]; then
            echo "::error::Found vendor directory in repository."
            exit 1
          fi
          echo "No vendor directories found"
          echo "::endgroup::"

      - name: Verify no private keys committed
        run: |
          set -euo pipefail
          echo "::group::Checking for private keys"
          FOUND=$(find . -name '*.pem' -o -name '*.key' -o -name 'id_rsa' -o -name 'id_ed25519' \
            | grep -v '.git/' | head -5 || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Found potential private key files:"
            echo "$FOUND"
            exit 1
          fi
          echo "No private keys found"
          echo "::endgroup::"

      - name: Verify no backup/temp files committed
        run: |
          set -euo pipefail
          echo "::group::Checking for backup files"
          FOUND=$(find . -name '*.bak' -o -name '*.backup' -o -name '*.backup-*' \
            | grep -v '.git/' | head -10 || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Found backup/temp files:"
            echo "$FOUND"
            exit 1
          fi
          echo "No backup files found"
          echo "::endgroup::"

      - name: Verify .gitignore rules
        run: |
          set -euo pipefail
          echo "::group::Verifying .gitignore"
          for pattern in "node_modules/" ".env" "vendor/" "apps/erp/.next/" "apps/website/.next/"; do
            if ! grep -qF "$pattern" .gitignore; then
              echo "::error::Missing .gitignore rule: $pattern"
              exit 1
            fi
          done
          echo "All required .gitignore rules present"
          echo "::endgroup::"

      - name: Verify .dockerignore exists
        run: |
          set -euo pipefail
          if [ ! -f ".dockerignore" ]; then
            echo "::error::.dockerignore file is missing"
            exit 1
          fi
          echo ".dockerignore exists"

  # ===========================================================================
  # Job 2: Backend Validation
  # ===========================================================================
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    needs: repo-safety
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict --no-check-lock

      - name: Install composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHP syntax lint
        working-directory: backend
        run: |
          set -euo pipefail
          echo "::group::PHP Syntax Check"
          ERROR_COUNT=0
          FILE_COUNT=0
          while IFS= read -r file; do
            FILE_COUNT=$((FILE_COUNT + 1))
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=$file::Syntax error in $file"
              php -l "$file" || true
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done < <(find app -name '*.php' -type f)
          echo "Checked $FILE_COUNT PHP files"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::$ERROR_COUNT PHP syntax errors found"
            exit 1
          fi
          echo "0 PHP syntax errors"
          echo "::endgroup::"

      - name: Verify bootstrap loads
        working-directory: backend
        run: |
          set -euo pipefail
          php -r "
            require_once __DIR__ . '/vendor/autoload.php';
            echo 'Autoloader OK' . PHP_EOL;
          "

  # ===========================================================================
  # Job 3: Website Build
  # ===========================================================================
  website-build:
    name: Website Build
    runs-on: ubuntu-latest
    needs: repo-safety
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/website/package-lock.json

      - name: Install dependencies
        working-directory: apps/website
        run: npm ci --legacy-peer-deps

      - name: Verify assetPrefix
        working-directory: apps/website
        run: |
          set -euo pipefail
          if ! grep -q "assetPrefix.*'/website'" next.config.js; then
            echo "::error::Website next.config.js is missing assetPrefix: '/website'"
            exit 1
          fi
          echo "assetPrefix = /website verified"

      - name: Production build
        working-directory: apps/website
        run: npm run build

      - name: Verify build output
        working-directory: apps/website
        run: |
          set -euo pipefail
          for dir in .next .next/server .next/static; do
            if [ ! -d "$dir" ]; then
              echo "::error::Missing build output directory: $dir"
              exit 1
            fi
          done
          if [ ! -f ".next/BUILD_ID" ]; then
            echo "::error::Missing .next/BUILD_ID"
            exit 1
          fi
          echo "Build output verified: .next/server, .next/static, BUILD_ID present"

  # ===========================================================================
  # Job 4: ERP Build
  # ===========================================================================
  erp-build:
    name: ERP Build
    runs-on: ubuntu-latest
    needs: repo-safety
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/erp/package-lock.json

      - name: Install dependencies
        working-directory: apps/erp
        run: npm ci --legacy-peer-deps

      - name: Verify assetPrefix
        working-directory: apps/erp
        run: |
          set -euo pipefail
          if ! grep -q "assetPrefix.*'/erp'" next.config.js; then
            echo "::error::ERP next.config.js is missing assetPrefix: '/erp'"
            exit 1
          fi
          echo "assetPrefix = /erp verified"

      - name: Production build
        working-directory: apps/erp
        run: npm run build

      - name: Verify build output
        working-directory: apps/erp
        run: |
          set -euo pipefail
          for dir in .next .next/server .next/static; do
            if [ ! -d "$dir" ]; then
              echo "::error::Missing build output directory: $dir"
              exit 1
            fi
          done
          if [ ! -f ".next/BUILD_ID" ]; then
            echo "::error::Missing .next/BUILD_ID"
            exit 1
          fi
          echo "Build output verified: .next/server, .next/static, BUILD_ID present"

  # ===========================================================================
  # Job 5: Docker Validation
  # ===========================================================================
  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    needs: repo-safety
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Docker Compose configuration
        run: |
          set -euo pipefail
          echo "::group::Docker Compose Config Validation"

          # Create a minimal .env for config validation only (not for runtime)
          cat > deployment/docker/.env <<'ENVEOF'
          APP_ENV=production
          APP_DEBUG=false
          DB_NAME=tnm_school
          DB_USER=tnm_user
          DB_PASSWORD=placeholder
          MYSQL_ROOT_PASSWORD=placeholder
          JWT_SECRET=placeholder
          JWT_ACCESS_TOKEN_TTL=3600
          JWT_REFRESH_TOKEN_TTL=604800
          NEXT_PUBLIC_API_URL=http://localhost/api
          ENVEOF

          docker compose \
            --env-file deployment/docker/.env \
            -f deployment/docker/docker-compose.yml \
            config --quiet

          echo "Docker Compose configuration is valid"
          echo "::endgroup::"

      - name: Verify Dockerfiles exist
        run: |
          set -euo pipefail
          for f in deployment/docker/Dockerfile.node \
                   deployment/docker/Dockerfile.php \
                   deployment/docker/Dockerfile.nginx; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing Dockerfile: $f"
              exit 1
            fi
          done
          echo "All Dockerfiles present"

      - name: Verify nginx configuration exists
        run: |
          set -euo pipefail
          if [ ! -f "deployment/docker/nginx/nginx.conf" ]; then
            echo "::error::Missing nginx configuration"
            exit 1
          fi
          echo "nginx.conf present"

      - name: Verify required services defined
        run: |
          set -euo pipefail
          COMPOSE="deployment/docker/docker-compose.yml"
          for svc in php nginx website erp mysql phpmyadmin; do
            if ! grep -q "^  ${svc}:" "$COMPOSE" 2>/dev/null && \
               ! grep -q "^  $svc:" "$COMPOSE" 2>/dev/null; then
              # Use yq-style grep
              if ! grep -qE "^\s+${svc}:" "$COMPOSE"; then
                echo "::error::Service '$svc' not found in docker-compose.yml"
                exit 1
              fi
            fi
          done
          echo "All 6 required services defined"
